description = "Our Education Community Credit Card includes no annual fee, a 0% pa introductory rate for the first six months on purchases, balance transfers and cash advances as well as a low ongoing interest rate after the first 6 months.  You’ll have the ability to make fast payments with Google Pay, Apple Pay, Samsung Pay, Garmin Pay and Visa payWave. It’s also highly secure, with microchip technology, 24/7 fraud monitoring, Visa’s Zero Liability policy and Visa Secure for online purchases from participating merchants and payWave. You’ll also be able to temporarily lock your card (if you misplace it), plus block payWave, international and online transactions whenever you need to – using the Mobile Banking App or Internet Banking. This is exclusive to current or retired employees of the South Australian education community, students carrying out studies in education, and their eligible immediate family members."
