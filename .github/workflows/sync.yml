name: Sync CDR data

on:
  schedule:
    # 20:17 UTC = 06:17/07:17 in Sydney. Off the hour, where GitHub delays
    # scheduled runs the most.
    - cron: "17 20 * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Sync
        run: bun run sync

      # Bot pushes made with GITHUB_TOKEN do not trigger CI, so run the
      # full check here before anything reaches main.
      - name: Check
        run: bun run check

      - name: Commit to main
        run: |
          if [ -z "$(git status --porcelain data history)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data history
          git commit -F .cache/sync-summary.md
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto main"
            git pull --rebase origin main
            bun run check
          done
          exit 1

      # Report only: compares manual earn rates with the issuer pages in
      # rewards.earn_check and never writes data/. A failure here must not
      # block the sync, so it is allowed to fail.
      - name: Check issuer earn pages
        continue-on-error: true
        run: bun run cli rewards check

      - name: Report held changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(jq '(.held | length) + ([.holds[] | select(has("decision") | not)] | length)' .cache/sync-report.json)
          number=$(gh issue list --label sync-held --state open --json number --jq '.[0].number')
          if [ "$pending" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "No changes are held."
            fi
            exit 0
          fi
          gh label create sync-held --color D93F0B --description "Data changes held back by sync guardrails" --force
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file .cache/sync-held.md
          else
            gh issue create --title "CDR sync: changes held for review" --label sync-held --body-file .cache/sync-held.md
          fi

      - name: Update earn-rate review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(jq '(.rewards.review | length) + (.bonus.review | length)' .cache/sync-report.json)
          changed=0
          if [ -f .cache/earn-check.json ]; then
            changed=$(jq '[.[] | select(.missing | length > 0)] | length' .cache/earn-check.json)
            printf '\n' >> .cache/rewards-review.md
            cat .cache/earn-check.md >> .cache/rewards-review.md
          fi
          number=$(gh issue list --label rewards-review --state open --json number --jq '.[0].number')
          if [ "$count" -eq 0 ] && [ "$changed" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "All earn rates and signup bonuses are resolved."
            fi
            exit 0
          fi
          gh label create rewards-review --color 0E8A16 --description "Earn rates and signup bonuses the parsers could not read" --force
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file .cache/rewards-review.md
          else
            gh issue create --title "Earn rates and signup bonuses to review" --label rewards-review --body-file .cache/rewards-review.md
          fi

      # Wakes the review agent only when something needs a reviewer. The
      # fingerprint is the set of open items, and the T3 webhook drops a
      # repeat of the same fingerprint, so an unchanged queue never re-runs it.
      - name: Ask the review agent
        if: always()
        env:
          WEBHOOK: ${{ secrets.T3_REVIEW_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "T3_REVIEW_WEBHOOK is not set"
            exit 0
          fi
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STATUS" != "success" ] || [ ! -f .cache/sync-report.json ]; then
            items=$(jq -nc --arg run "$GITHUB_RUN_ID" '{failed: [$run]}')
          else
            earn_check='[]'
            if [ -f .cache/earn-check.json ]; then
              earn_check=$(jq -c '[.[] | select(.missing | length > 0) | .card]' .cache/earn-check.json)
            fi
            items=$(jq -c --argjson earn_check "$earn_check" '{
              holds: [.holds[] | select(.kind == "approve" and (has("decision") | not)) | .id],
              held: [.held[].card],
              earn: [.rewards.review[].card],
              bonus: [.bonus.review[].card],
              earn_check: $earn_check,
              missing: .missing,
              discontinued: .discontinued,
              brands: [.brandErrors[].brand]
            }' .cache/sync-report.json)
          fi
          if [ "$(jq '[.[] | length] | add' <<< "$items")" -eq 0 ]; then
            echo "Nothing needs a reviewer"
            exit 0
          fi
          fingerprint=$(jq -cS . <<< "$items" | sha256sum | cut -c1-16)
          echo "Items: $items"
          jq -nc --arg fingerprint "$fingerprint" --arg run "$run" --argjson items "$items" \
            '{event: "sync-needs-review", fingerprint: $fingerprint, run: $run, items: $items}' \
            | curl -fsS -X POST -H 'content-type: application/json' --data-binary @- "$WEBHOOK" \
            || echo "::warning::Could not reach the review agent webhook"
