name: Sync CDR data

on:
  schedule:
    # 20:00 UTC = 06:00/07:00 in Sydney
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Sync
        run: bun run sync

      - name: Validate
        run: bun run validate

      - name: Commit to main
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -F .cache/sync-summary.md
          git push origin HEAD:main

      - name: Report held changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          held=$(jq '.held | length' .cache/sync-report.json)
          if [ "$held" -eq 0 ]; then
            exit 0
          fi
          gh label create sync-held --color D93F0B --description "Data changes held back by sync guardrails" --force
          number=$(gh issue list --label sync-held --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file .cache/sync-summary.md
          else
            gh issue create --title "CDR sync: changes held for review" --label sync-held --body-file .cache/sync-summary.md
          fi

      - name: Update earn-rate review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(jq '.rewards.review | length' .cache/sync-report.json)
          number=$(gh issue list --label rewards-review --state open --json number --jq '.[0].number')
          if [ "$count" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "All earn rates are resolved."
            fi
            exit 0
          fi
          gh label create rewards-review --color 0E8A16 --description "Earn rates the parser could not read" --force
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file .cache/rewards-review.md
          else
            gh issue create --title "Earn rates to review" --label rewards-review --body-file .cache/rewards-review.md
          fi
