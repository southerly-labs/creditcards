name: CI

# Backstop for the pre-commit hook: same checks, in a clean checkout.
on:
  push:
    branches: [main]

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
